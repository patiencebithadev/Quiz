<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savoryth</title>

    <!-- style css personnaliser -->

    <link rel="stylesheet" href="style/style.css">
        <!-- icone fontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- style boots trap -->
     <link rel="stylesheet" href="style/bootstrap.min.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <img src="ressource/image/file_00000000025c820e9ffa92e688764b77.png" alt="Bootstrap" width="40" height="29">
            <a class="navbar-brand fw-bold" href="#">Savoryth</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="index.html">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="Quiz.html">Quiz</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="Stat.html">Statistiques</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="apropos.html">À propos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENU STATISTIQUES -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom p-4 bg-white">
                    <h2 class="text-primary fw-bold mb-3">📊 Tableau de Bord</h2>
                    <p class="text-muted mb-4">Voici l'historique de tes sessions enregistrées :</p>
                    <div id="stats-history" class="table-responsive">
                        <!-- Les scores s'afficheront ici dynamiquement -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/bootstrap-icons.json"></script>
    <!-- Script pour afficher l'historique -->
    <script>
        (function() {
            var history = JSON.parse(localStorage.getItem("edusmart_history") || "[]");
            var container = document.getElementById("stats-history");

            if (history.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucune session enregistrée pour l\'instant. Fais un quiz pour voir tes résultats !</p>';
                return;
            }

            var html = '<table class="table table-hover align-middle"><thead><tr><th>Date</th><th>Nom</th><th>Matière</th><th>Score</th></tr></thead><tbody>';
            history.forEach(function(item) {
                html += '<tr><td>' + item.date + '</td><td class="fw-bold">' + item.user + '</td><td><span class="badge bg-secondary">' + item.subject + '</span></td><td class="text-success fw-bold">' + item.score + ' / ' + item.maxScore + '</td></tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        })();
    </script>
</body>
</html>

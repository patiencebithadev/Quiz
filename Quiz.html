<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savoryth</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="style/bootstrap.min.css">
    <!-- Style CSS externe -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- icone fontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <img src="ressource/image/file_00000000025c820e9ffa92e688764b77.png" alt="Bootstrap" width="40" height="29">
            <a class="navbar-brand fw-bold" href="#">Savoryth</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="index.html">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="Quiz.html">Quiz</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="Stat.html">Statistiques</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="apropos.html">À propos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTAINER DU QUIZ -->
    <div class="container d-flex flex-column justify-content-center align-items-center py-5">
        <div class="col-md-8 col-lg-6">
            
            <!-- ÉCRAN 1 : ACCUEIL DU QUIZ (CONFIGURATION) -->
            <div id="home-screen" class="card card-custom p-4 bg-white">
                <h2 class="text-center mb-4 text-primary fw-bold">Quiz Adaptatif</h2>
                <p class="text-muted text-center mb-4">Teste ta logique en Mathématiques, Statistiques et Informatique !</p>
                
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Ton nom ou pseudo :</label>
                    <input type="text" id="username" class="form-control" placeholder="Ex: Patience">
                </div>

                <div class="mb-4">
                    <label for="subject" class="form-label fw-semibold">Choisis ta matière :</label>
                    <select id="subject" class="form-select">
                        <option value="math">Mathématiques</option>
                        <option value="stats">Statistiques</option>
                        <option value="algo">Informatique</option>
                    </select>
                </div>

                <button onclick="startQuiz()" class="btn btn-primary w-100 py-2 fw-bold">Commencer l'entraînement</button>
            </div>

            <!-- ÉCRAN 2 : QUIZ EN COURS -->
            <div id="quiz-screen" class="card card-custom p-4 bg-white d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span id="badge-level" class="badge bg-secondary">Niveau : Facile</span>
                    <span id="score-display" class="fw-bold text-success">Score : 0</span>
                </div>

                <h4 id="question-text" class="mb-4 text-dark"></h4>

                <div id="options-container" class="d-grid gap-2 mb-3"></div>

                <div class="text-end">
                    <button id="next-btn" onclick="nextQuestion()" class="btn btn-dark d-none">Question suivante</button>
                </div>
            </div>

            <!-- ÉCRAN 3 : RÉSULTATS -->
            <div id="result-screen" class="card card-custom p-4 bg-white text-center d-none">
                <h2 class="text-success mb-3">🎉 Quiz Terminé !</h2>
                <h4 id="final-message" class="mb-3"></h4>
                <p id="final-stats" class="text-muted mb-4"></p>
                <button onclick="restartQuiz()" class="btn btn-outline-primary w-100">Recommencer</button>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/bootstrap-icons.json"></script>
    <script src="js/quiz.js"></script>
    <script src="js/data.js"></script>
</body>
</html>
